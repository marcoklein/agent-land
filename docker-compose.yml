version: "3.8"

services:
  orchestrator:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/app/secrets
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=development

volumes:
  agent-land-sessions:
