name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Dokku allows a single active deploy; bursts of merged PRs fire concurrent
    # pushes and fail with "deploy lock in place". Serialize them so later runs
    # wait instead of racing, and cancel none (each push is idempotent-ish, but
    # dropping one would skip a merge's content).
    concurrency:
      group: dokku-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known hosts (pinned key)
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/known_hosts <<'EOF'
          impromat.app ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHZ724vLK/knBUwH7Ir59Oeqv/Ii88luGVZfSMCFdFev
          EOF

      - name: Deploy to Dokku
        run: |
          git remote add dokku dokku@impromat.app:agent-land
          # Retry the push against Dokku's deploy lock: another deploy (e.g. a
          # concurrent merge) may hold it for up to ~a minute. Back off and retry
          # instead of failing the workflow.
          for i in 1 2 3 4 5 6; do
            if git push dokku main:master --force; then
              exit 0
            fi
            echo "deploy push failed (attempt $i); backing off and retrying"
            sleep 15
          done
          echo "deploy push failed after 6 attempts"
          exit 1

      - name: Verify deploy is serving
        env:
          HOSTED_BASIC_AUTH: ${{ secrets.HOSTED_BASIC_AUTH }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -u "$HOSTED_BASIC_AUTH" https://agent-land.host.impromat.app/api/sessions | grep -q '"sessions"'; then
              echo "deploy verified"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed after 60s"
          exit 1
