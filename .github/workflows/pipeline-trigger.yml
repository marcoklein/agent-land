name: Pipeline trigger

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Spawn orchestrator sessions for unstarted pipeline-ready issues
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_LAND_URL: ${{ secrets.AGENT_LAND_URL }}
          AGENT_LAND_BASIC_AUTH: ${{ secrets.AGENT_LAND_BASIC_AUTH }}
        run: |
          set -euo pipefail

          REPO="marcoklein/agent-land"
          # The orchestrator posts this marker as its first issue comment and a
          # completion summary as its last (see agent-image/skills/orchestrator/
          # SKILL.md). Together they are the idempotency guard: an issue carrying
          # either has been started (or finished), so it must not be spawned again.
          START_MARKER="Orchestrator started"
          DONE_MARKER="Pipeline complete"
          # A human who wants to run an already-completed issue again adds the
          # `rerun` label. Once the run kicks off the label is removed, so a
          # subsequent poll does not spawn a second orchestrator.
          RERUN_LABEL="rerun"

          : "${AGENT_LAND_URL:?AGENT_LAND_URL secret is not set}"
          : "${AGENT_LAND_BASIC_AUTH:?AGENT_LAND_BASIC_AUTH secret is not set}"

          # Connector resolution is by exact name, so discover the GitHub
          # connector (the one injecting GITHUB_TOKEN) instead of hardcoding.
          gh_connector="$(curl -fsS -u "$AGENT_LAND_BASIC_AUTH" "$AGENT_LAND_URL/api/connectors" \
            | jq -er '[.connectors[] | select(.envKeys | index("GITHUB_TOKEN")) | .name][0]')"

          issues="$(gh issue list --repo "$REPO" --label pipeline-ready --state open --json number --jq '.[].number')"

          if [ -z "$issues" ]; then
            echo "No open pipeline-ready issues; nothing to do."
            exit 0
          fi

          for n in $issues; do
            if ! comments="$(gh issue view "$n" --repo "$REPO" --json comments --jq '.comments[].body')"; then
              echo "issue #$n: could not read comments (transient gh/token failure); skipping to avoid a duplicate spawn"
              continue
            fi

            # The START/DONE markers latch forever, so an intentional re-run is
            # signalled by the `rerun` label — which overrides BOTH latches and is
            # consumed (removed) here so the next poll cannot double-spawn.
            rerun="$(gh issue view "$n" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qF "$RERUN_LABEL" && echo 1 || echo 0)"

            if [ "$rerun" = "0" ]; then
              if printf '%s' "$comments" | grep -qF "$DONE_MARKER"; then
                echo "issue #$n already has the completion marker; skipping (add the $RERUN_LABEL label to re-run)"
                continue
              fi
              if printf '%s' "$comments" | grep -qF "$START_MARKER"; then
                echo "issue #$n already has the orchestrator start marker; skipping"
                continue
              fi
            else
              echo "issue #$n labeled $RERUN_LABEL; re-running regardless of marker state"
              gh issue edit "$n" --repo "$REPO" --remove-label "$RERUN_LABEL"
            fi

            echo "issue #$n is pipeline-ready; spawning an orchestrator session"

            session_id="$(curl -fsS -u "$AGENT_LAND_BASIC_AUTH" \
              -X POST "$AGENT_LAND_URL/api/sessions" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg c "$gh_connector" '{connectors:[$c],platform:true}')" \
              | jq -er '.session.id')"

            prompt="You are the agent-land product-pipeline orchestrator (planner). Run the pipeline on issue #$n in $REPO. Your recipe is the orchestrator skill at agent-image/skills/orchestrator/SKILL.md (branch main) — read it and follow it exactly: plan a per-task stage graph from policy.yaml, post the plan as Gate 0, then execute it as child sessions via the loopback with the gate discipline. Proceed now; do not wait for confirmation."

            curl -fsS -u "$AGENT_LAND_BASIC_AUTH" \
              -X POST "$AGENT_LAND_URL/api/sessions/$session_id/prompt" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg m "$prompt" '{message: $m}')" >/dev/null

            echo "spawned session $session_id for issue #$n"
          done
